name: Telegram Channel Auto Post

on:
  schedule:
    - cron: '*/20 * * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Post one random item to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
          TG_BOT_USERNAME: ${{ secrets.TG_BOT_USERNAME }}
          SITE_URL: ${{ secrets.SITE_URL }}

        run: |
          set -e

          python3 << 'PY'
          import os
          import json
          import random
          import urllib.request
          import urllib.parse
          import urllib.error
          import datetime
          import pathlib
          import traceback
          import html

          def need(k):
              v = (os.environ.get(k) or "").strip()
              if not v:
                  raise SystemExit(f"Missing secret/env: {k}")
              return v

          TOKEN = need("TG_BOT_TOKEN")
          CHANNEL = need("TG_CHANNEL")
          BOT_USER = need("TG_BOT_USERNAME").lstrip("@")
          SITE = need("SITE_URL").rstrip("/")

          print("SITE_URL =", SITE)
          print("CHANNEL  =", CHANNEL)
          print("BOT_USER =", BOT_USER)

          now = datetime.datetime.utcnow()
          today = now.strftime("%Y-%m-%d")

          state_path = pathlib.Path(
              ".github/telegram_posted_state.json"
          )

          def load_state():
              if state_path.exists():
                  try:
                      return json.loads(
                          state_path.read_text(
                              encoding="utf-8"
                          )
                      )
                  except Exception:
                      print("Invalid state file.")

              return {
                  "date": today,
                  "urls": []
              }

          def save_state(st):
              state_path.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              state_path.write_text(
                  json.dumps(
                      st,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

          def http_get(url, timeout=60):
              print("GET", url)

              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "TG-AutoPost/3.1"
                  }
              )

              with urllib.request.urlopen(
                  req,
                  timeout=timeout
              ) as r:
                  body = r.read().decode(
                      "utf-8",
                      "replace"
                  )

                  print(
                      "HTTP",
                      r.status,
                      "len=",
                      len(body)
                  )

                  return body

          def list_url(site, page):
              """Build list API URL per tab (babe/hub vs viral vs tales)."""
              if site == "viral":
                  return (
                      f"{SITE}/api/deshiviral.php"
                      f"?action=list&page={page}"
                  )
              if site == "tales":
                  return (
                      f"{SITE}/api/desitales.php"
                      f"?action=list&page={page}"
                  )
              # babe / hub (and hub2 if ever added)
              return (
                  f"{SITE}/"
                  f"?action=list"
                  f"&page={page}"
                  f"&site="
                  f"{urllib.parse.quote(site)}"
              )

          def details_url(post_url, site):
              if site == "viral":
                  q = urllib.parse.urlencode({
                      "action": "details",
                      "url": post_url,
                  })
                  return f"{SITE}/api/deshiviral.php?{q}"
              if site == "tales":
                  q = urllib.parse.urlencode({
                      "action": "details",
                      "url": post_url,
                  })
                  return f"{SITE}/api/desitales.php?{q}"
              q = urllib.parse.urlencode({
                  "action": "details",
                  "url": post_url,
                  "site": site,
              })
              return f"{SITE}/?{q}"

          def fetch_list(site, page):

              url = list_url(site, page)

              raw = http_get(url)

              try:
                  data = json.loads(raw)
              except Exception:
                  print("LIST RAW HEAD:", raw[:500])
                  raise

              items = (
                  data
                  if isinstance(data, list)
                  else (data.get("items") or [])
              )

              out = []

              for it in items:

                  if not isinstance(it, dict):
                      continue

                  u = (it.get("url") or "").strip()
                  title = (it.get("title") or "").strip()
                  image = (it.get("image") or "").strip()
                  description = (
                      it.get("description") or ""
                  ).strip()

                  if u and title:
                      out.append({
                          "title": title,
                          "image": image,
                          "description": description,
                          "url": u,
                          "site": site,
                          "page": page
                      })

              print(
                  f"LIST {site} PAGE {page}: "
                  f"{len(out)} items"
              )

              return out

          def fetch_details(post_url, site):

              raw = http_get(
                  details_url(post_url, site)
              )

              try:
                  data = json.loads(raw)
              except Exception:
                  print(
                      "DETAILS RAW HEAD:",
                      raw[:300]
                  )
                  return ""

              if not data.get("success"):
                  return ""

              d = data.get("data") or {}

              desc = (
                  d.get("description") or ""
              ).strip()

              desc = " ".join(desc.split())

              return desc[:300]

          def slug_from_url(u):

              try:
                  return (
                      urllib.parse
                      .urlparse(u)
                      .path
                      .rstrip("/")
                      .split("/")[-1]
                      or ""
                  )
              except Exception:
                  return ""

          def play_link(item):

              slug = (
                  slug_from_url(item["url"])
                  or urllib.parse.quote(
                      item["title"][:40]
                  )
              )

              tab = item.get("site") or "babe"

              start = f"play_{slug}_{tab}"

              return (
                  f"https://t.me/"
                  f"{BOT_USER}"
                  f"?startapp="
                  f"{urllib.parse.quote(start)}"
              )

          def tg_api(method, payload):

              url = (
                  f"https://api.telegram.org/"
                  f"bot{TOKEN}/{method}"
              )

              data = (
                  urllib.parse
                  .urlencode(payload)
                  .encode("utf-8")
              )

              req = urllib.request.Request(
                  url,
                  data=data,
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      req,
                      timeout=60
                  ) as r:

                      return json.loads(
                          r.read().decode(
                              "utf-8",
                              "replace"
                          )
                      )

              except urllib.error.HTTPError as e:

                  body = e.read().decode(
                      "utf-8",
                      "replace"
                  )

                  print(
                      "TG HTTP",
                      e.code,
                      body
                  )

                  try:
                      return json.loads(body)
                  except Exception:
                      raise RuntimeError(
                          f"TG HTTP {e.code}: {body}"
                      ) from e

          # =========================
          # HOT ADULT VIBE EMOJIS
          # =========================

          TITLE_EMOJIS = [
              "🔥",
              "💋",
              "😈",
              "🥵",
              "🫦",
              "💦",
              "🍑",
              "🌶️",
              "💯",
              "✨",
              "💖",
              "💕",
              "🎀",
              "👑",
              "🌸",
              "💫",
              "🦋",
              "🫣",
              "😈",
              "🔥",
          ]

          DESC_EMOJIS = [
              "🔥",
              "💋",
              "🥵",
              "💦",
              "😈",
              "🫦",
              "🍑",
              "🌶️",
          ]

          def make_title(title):

              emoji = random.choice(
                  TITLE_EMOJIS
              )
              emoji2 = random.choice(
                  TITLE_EMOJIS
              )

              # Escape Telegram HTML
              safe_title = html.escape(
                  title[:180],
                  quote=False
              )

              return (
                  f"{emoji} "
                  f"<b>{safe_title}</b> "
                  f"{emoji2}"
              )

          def make_description(desc):

              if not desc:
                  return ""

              em = random.choice(DESC_EMOJIS)

              safe_desc = html.escape(
                  desc[:250],
                  quote=False
              )

              return (
                  f"{em} <i>{safe_desc}</i>"
              )

          def post_item(item):

              title = (
                  item.get("title") or ""
              ).strip()

              desc = (
                  item.get("description") or ""
              ).strip()

              if not desc:

                  try:
                      desc = fetch_details(
                          item["url"],
                          item.get("site")
                          or "babe"
                      )
                  except Exception as e:
                      print(
                          "DETAILS FAILED:",
                          e
                      )
                      desc = ""

              title_text = make_title(
                  title
              )

              desc_text = make_description(
                  desc
              )

              if desc_text:

                  caption = (
                      f"{title_text}\n\n"
                      f"{desc_text}\n\n"
                      f"👇 <b>See TheNude "
                      f"For Clicked</b> 🔥"
                  )

              else:

                  caption = (
                      f"{title_text}\n\n"
                      f"👇 <b>See Nude for"
                      f"Click The Button</b> 🔥"
                  )

              caption = caption[:1024]

              btn = play_link(item)

              print(
                  "TITLE =",
                  title
              )

              print(
                  "PLAY BTN =",
                  btn
              )

              keyboard = {
                  "inline_keyboard": [[
                      {
                          "text":
                              "▶️ Play The Nude 🔥",
                          "url": btn
                      }
                  ]]
              }

              markup = json.dumps(
                  keyboard,
                  ensure_ascii=False
              )

              photo = (
                  item.get("image") or ""
              ).strip()

              # =========================
              # SEND PHOTO
              # =========================

              if photo.startswith("http"):

                  print(
                      "sendPhoto",
                      photo[:120]
                  )

                  res = tg_api(
                      "sendPhoto",
                      {
                          "chat_id": CHANNEL,
                          "photo": photo,
                          "caption": caption,
                          "reply_markup": markup,
                          "parse_mode": "HTML"
                      }
                  )

                  if res.get("ok"):
                      print("sendPhoto OK")
                      return res

                  print(
                      "sendPhoto failed -> "
                      "sendMessage fallback"
                  )

                  print(
                      res.get("description")
                  )

              # =========================
              # SEND MESSAGE
              # =========================

              text = caption

              if photo.startswith("http"):
                  text = (
                      f"{caption}\n\n"
                      f"🖼️ {photo}"
                  )

              print("sendMessage")

              res = tg_api(
                  "sendMessage",
                  {
                      "chat_id": CHANNEL,
                      "text": text[:4000],
                      "reply_markup": markup,
                      "parse_mode": "HTML",
                      "disable_web_page_preview": "false"
                  }
              )

              print(
                  "TG response ok=",
                  res.get("ok")
              )

              if not res.get("ok"):
                  raise RuntimeError(res)

              return res

          # =========================
          # PAGE WEIGHTS
          # =========================

          def page_weight(page):

              # Latest page gets highest priority
              if page == 1:
                  return 50

              # Recent pages
              if 2 <= page <= 5:
                  return 30

              # Older pages
              if 6 <= page <= 10:
                  return 12

              # All remaining pages
              return 8

          # =========================
          # RANDOM PAGE TARGETS
          # =========================

          def weighted_targets(
              site,
              max_page=50
          ):

              targets = []

              # Viral / Tales: fewer deep pages (list APIs differ)
              if site in ("viral", "tales"):
                  max_page = min(max_page, 15)

              for page in range(
                  1,
                  max_page + 1
              ):

                  weight = page_weight(
                      page
                  )

                  for _ in range(weight):
                      targets.append(
                          (
                              site,
                              page
                          )
                      )

              random.shuffle(targets)

              return targets

          # =========================
          # MAIN
          # =========================

          try:

              state = load_state()

              if state.get("date") != today:

                  state = {
                      "date": today,
                      "urls": []
                  }

              posted = set(
                  state.get("urls") or []
              )

              print(
                  "TODAY =",
                  today
              )

              print(
                  "POSTED TODAY =",
                  len(posted)
              )

              # =========================
              # RANDOM SITE (4 tabs)
              # =========================

              sites = [
                  "babe",
                  "hub",
                  "viral",
                  "tales",
              ]

              random.shuffle(sites)

              pick = None

              # =========================
              # SEARCH TARGETS
              # =========================

              for site in sites:

                  targets = weighted_targets(
                      site,
                      max_page=50
                  )

                  checked_pages = set()

                  for target_site, page in targets:

                      if page in checked_pages:
                          continue

                      checked_pages.add(page)

                      try:

                          items = fetch_list(
                              target_site,
                              page
                          )

                      except Exception as e:

                          print(
                              f"LIST FAILED "
                              f"{target_site} "
                              f"page {page}:",
                              e
                          )

                          continue

                      if not items:
                          continue

                      # Only unused URLs
                      pool = [
                          x
                          for x in items
                          if x["url"] not in posted
                      ]

                      if not pool:

                          print(
                              f"USED/EMPTY: "
                              f"{target_site} "
                              f"page {page}"
                          )

                          continue

                      # Random item
                      pick = random.choice(
                          pool
                      )

                      print(
                          "SELECTED:"
                      )

                      print(
                          "SITE =",
                          target_site
                      )

                      print(
                          "PAGE =",
                          page
                      )

                      print(
                          "TOTAL ITEMS =",
                          len(items)
                      )

                      print(
                          "UNUSED ITEMS =",
                          len(pool)
                      )

                      print(
                          "TITLE =",
                          pick["title"]
                      )

                      print(
                          "URL =",
                          pick["url"]
                      )

                      break

                  if pick:
                      break

              # =========================
              # NOTHING AVAILABLE
              # =========================

              if not pick:

                  raise SystemExit(
                      "No unused item found."
                  )

              # =========================
              # POST
              # =========================

              post_item(pick)

              # =========================
              # SAVE STATE
              # =========================

              posted.add(
                  pick["url"]
              )

              state["date"] = today
              state["urls"] = list(posted)

              save_state(state)

              print(
                  "SUCCESS"
              )

              print(
                  "TOTAL POSTED TODAY =",
                  len(posted)
              )

          except Exception:

              traceback.print_exc()
              raise

          PY

      - name: Commit state
        if: always()
        run: |
          if [ -f .github/telegram_posted_state.json ]; then

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add .github/telegram_posted_state.json

            git diff --staged --quiet || \
              git commit \
              -m "chore: telegram post state [skip ci]"

            git push || echo "push skipped"

          fi
